# Packages GitHub repository secrets into an encrypted artifact for local download.
# Triggered by sync-secrets.ps1 via `gh workflow run`.
#
# The workflow encrypts secrets with SYNC_PASSPHRASE (a GitHub Secret).
# The matching passphrase must be stored locally at %USERPROFILE%\.pcsetup-sync-passphrase.
# See .secrets.example for first-time setup instructions.

name: Sync Secrets

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  package-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        env:
          FFXIVBE_PEM_B64: ${{ secrets.FFXIVBE_PEM_B64 }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SSHWIFTY_CONF_B64: ${{ secrets.SSHWIFTY_CONF_B64 }}
          CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN: ${{ secrets.CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN }}
        shell: bash
        run: |
          {
            echo "# Auto-generated by sync-secrets workflow — do not edit manually."
            printf '# Last synced: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "# ─── ffxivbe.org (cloudflared) ──────────────────────────────────"
            echo "# Decode: [IO.File]::WriteAllBytes('ffxivbe.pem', [Convert]::FromBase64String(\$env:FFXIVBE_PEM_B64))"
            printf 'FFXIVBE_PEM_B64=%s\n' "${FFXIVBE_PEM_B64}"
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "${CLOUDFLARE_TUNNEL_TOKEN}"
            echo ""
            echo "# ─── GitHub ──────────────────────────────────────────────────────"
            printf 'GH_PAT=%s\n' "${GH_PAT}"
            echo ""
            echo "# ─── Web console (sshwifty) ──────────────────────────────────────"
            printf 'SSHWIFTY_CONF_B64=%s\n' "${SSHWIFTY_CONF_B64}"
            echo ""
            echo "# ─── Cloudflare Zero Trust ───────────────────────────────────────"
            printf 'CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN=%s\n' "${CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN}"
          } > secrets-plain.txt

      - name: Encrypt secrets file
        env:
          PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: |
          openssl aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in secrets-plain.txt \
            -out secrets-encrypted.bin \
            -pass env:PASSPHRASE

      - name: Upload encrypted artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-encrypted
          path: secrets-encrypted.bin
          retention-days: 1
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          rm -f secrets-plain.txt
          rm -f secrets-encrypted.bin
