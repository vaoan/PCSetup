# Packages GitHub repository secrets into an encrypted artifact for local download.
# Triggered by sync-secrets.ps1 via `gh workflow run`.
#
# The workflow encrypts secrets with SYNC_PASSPHRASE (a GitHub Secret).
# The matching passphrase must be stored locally at %USERPROFILE%\.pcsetup-sync-passphrase.
# See .secrets.example for first-time setup instructions.

name: Sync Secrets

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  package-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        env:
          FFXIVBE_PEM_B64: ${{ secrets.FFXIVBE_PEM_B64 }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SSHWIFTY_CONF_B64: ${{ secrets.SSHWIFTY_CONF_B64 }}
          CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN: ${{ secrets.CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          DNSIMPLE_API_TOKEN: ${{ secrets.DNSIMPLE_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_VOICE_CHANNEL_ID: ${{ secrets.DISCORD_VOICE_CHANNEL_ID }}
          RACKNERD_VPS_IP: ${{ secrets.RACKNERD_VPS_IP }}
          RACKNERD_VPS_USER: ${{ secrets.RACKNERD_VPS_USER }}
          RACKNERD_VPS_PASSWORD: ${{ secrets.RACKNERD_VPS_PASSWORD }}
          RACKNERD_VPS_HOSTKEY: ${{ secrets.RACKNERD_VPS_HOSTKEY }}
          RACKNERD_VPS_LABEL: ${{ secrets.RACKNERD_VPS_LABEL }}
          RACKNERD_VPS_SSH_PORT: ${{ secrets.RACKNERD_VPS_SSH_PORT }}
          RACKNERD_NERDVM_USER: ${{ secrets.RACKNERD_NERDVM_USER }}
          RACKNERD_NERDVM_PASSWORD: ${{ secrets.RACKNERD_NERDVM_PASSWORD }}
          SPOTIFY_GO_LIBRESPOT_STATE_B64: ${{ secrets.SPOTIFY_GO_LIBRESPOT_STATE_B64 }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        shell: bash
        run: |
          {
            echo "# Auto-generated by sync-secrets workflow — do not edit manually."
            printf '# Last synced: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "# ─── ffxiv.be (cloudflared) ─────────────────────────────────────"
            echo "# Decode: [IO.File]::WriteAllBytes('ffxivbe.pem', [Convert]::FromBase64String(\$env:FFXIVBE_PEM_B64))"
            printf 'FFXIVBE_PEM_B64=%s\n' "${FFXIVBE_PEM_B64}"
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "${CLOUDFLARE_TUNNEL_TOKEN}"
            echo ""
            echo "# ─── GitHub ──────────────────────────────────────────────────────"
            printf 'GH_PAT=%s\n' "${GH_PAT}"
            echo ""
            echo "# ─── Web console (sshwifty) ──────────────────────────────────────"
            printf 'SSHWIFTY_CONF_B64=%s\n' "${SSHWIFTY_CONF_B64}"
            echo ""
            echo "# ─── Cloudflare Zero Trust ───────────────────────────────────────"
            printf 'CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN=%s\n' "${CLOUDFLARE_FFXIVBE_ZERO_TRUST_API_TOKEN}"
            echo ""
            echo "# ─── Cloudflare account admin (DNS, SSL, WAF, Tunnel, Workers, Access) ──"
            printf 'CLOUDFLARE_ACCOUNT_API_TOKEN=%s\n' "${CLOUDFLARE_ACCOUNT_API_TOKEN}"
            echo ""
            echo "# ─── DNSimple (registrar for ffxiv.be) ───────────────────────────"
            printf 'DNSIMPLE_API_TOKEN=%s\n' "${DNSIMPLE_API_TOKEN}"
            echo ""
            echo "# ─── Spotify → Discord bridge ────────────────────────────────────"
            printf 'DISCORD_BOT_TOKEN=%s\n' "${DISCORD_BOT_TOKEN}"
            printf 'DISCORD_GUILD_ID=%s\n' "${DISCORD_GUILD_ID}"
            printf 'DISCORD_VOICE_CHANNEL_ID=%s\n' "${DISCORD_VOICE_CHANNEL_ID}"
            echo ""
            echo "# ─── RackNerd cloud VPS (spotify-discord/cloud) ──────────────────"
            printf 'RACKNERD_VPS_IP=%s\n' "${RACKNERD_VPS_IP}"
            printf 'RACKNERD_VPS_USER=%s\n' "${RACKNERD_VPS_USER}"
            printf 'RACKNERD_VPS_PASSWORD=%s\n' "${RACKNERD_VPS_PASSWORD}"
            printf 'RACKNERD_VPS_HOSTKEY=%s\n' "${RACKNERD_VPS_HOSTKEY}"
            printf 'RACKNERD_VPS_LABEL=%s\n' "${RACKNERD_VPS_LABEL}"
            printf 'RACKNERD_VPS_SSH_PORT=%s\n' "${RACKNERD_VPS_SSH_PORT}"
            printf 'RACKNERD_NERDVM_USER=%s\n' "${RACKNERD_NERDVM_USER}"
            printf 'RACKNERD_NERDVM_PASSWORD=%s\n' "${RACKNERD_NERDVM_PASSWORD}"
            echo ""
            echo "# ─── Spotify go-librespot reusable credentials (login-free restore) ──"
            echo "# Decode on the VPS: base64 -d > ~/.config/go-librespot/state.json"
            printf 'SPOTIFY_GO_LIBRESPOT_STATE_B64=%s\n' "${SPOTIFY_GO_LIBRESPOT_STATE_B64}"
            printf 'SPOTIFY_CLIENT_ID=%s\n' "${SPOTIFY_CLIENT_ID}"
            printf 'SPOTIFY_CLIENT_SECRET=%s\n' "${SPOTIFY_CLIENT_SECRET}"
          } > secrets-plain.txt

      - name: Encrypt secrets file
        env:
          PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: |
          openssl aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in secrets-plain.txt \
            -out secrets-encrypted.bin \
            -pass env:PASSPHRASE

      - name: Upload encrypted artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-encrypted
          path: secrets-encrypted.bin
          retention-days: 1
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          rm -f secrets-plain.txt
          rm -f secrets-encrypted.bin
