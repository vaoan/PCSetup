# Packages GitHub repository secrets into an encrypted artifact for local download.
# Triggered by sync-secrets.ps1 via `gh workflow run`.
#
# The workflow writes named secrets to a file, encrypts it with a one-time
# passphrase provided as input, uploads the encrypted artifact (1-day retention),
# and always deletes the unencrypted file.

name: Sync Secrets

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "One-time encryption passphrase (generated by sync-secrets.ps1)"
        required: true
        type: string

permissions:
  actions: write

jobs:
  package-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        env:
          FFXIVBE_PEM_B64: ${{ secrets.FFXIVBE_PEM_B64 }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        shell: bash
        run: |
          {
            echo "# Auto-generated by sync-secrets workflow — do not edit manually."
            echo "# Last synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "# ─── ffxivbe.org (cloudflared) ──────────────────────────────────"
            echo "# Decode: [IO.File]::WriteAllBytes('ffxivbe.pem', [Convert]::FromBase64String(\$env:FFXIVBE_PEM_B64))"
            echo "FFXIVBE_PEM_B64=${FFXIVBE_PEM_B64}"
            echo "CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}"
            echo ""
            echo "# ─── GitHub ──────────────────────────────────────────────────────"
            echo "GITHUB_PAT=${GITHUB_PAT}"
          } > secrets-plain.txt

      - name: Encrypt secrets file
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          openssl aes-256-cbc -pbkdf2 -salt \
            -in secrets-plain.txt \
            -out secrets-encrypted.bin \
            -pass env:PASSPHRASE

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-encrypted
          path: secrets-encrypted.bin
          retention-days: 1
          if-no-files-found: error

      - name: Clean up unencrypted file
        if: always()
        run: rm -f secrets-plain.txt
